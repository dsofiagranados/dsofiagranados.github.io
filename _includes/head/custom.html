{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- Homepage hero banner + sage refinements -->
<style>
  .home-hero {
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    width: 100vw;
    max-width: 100vw;
    box-sizing: border-box;
    margin-top: -1.5em;
    margin-bottom: 2.2em;
    padding-bottom: 1.8em;
    text-align: center;
    border-bottom: 1px solid var(--global-border-color);
  }
  .home-hero__banner {
    width: 100%;
    height: 300px;
    background-image: url('/images/banner.jpg');
    background-size: cover;
    background-position: center 40%;
  }
  .home-hero__avatar {
    width: 156px;
    height: 156px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid var(--global-bg-color);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
    margin: -84px auto 0.7em;
    position: relative;
    z-index: 1;
    display: block;
  }
  @media (max-width: 600px) {
    .home-hero__banner { height: 190px; }
    .home-hero__avatar { width: 122px; height: 122px; margin-top: -66px; }
  }
  .home-hero__name {
    margin: 0.1em 0 0.15em;
    font-size: 2.1em;
    font-weight: 700;
    color: var(--global-text-color);
  }
  .home-hero__title {
    margin: 0 0 1.1em;
    color: var(--global-text-color-light);
    font-size: 1.05em;
  }
  .home-hero__links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    justify-content: center;
    margin: 0;
  }
  .home-hero__btn {
    display: inline-block;
    padding: 0.42em 1.05em;
    border-radius: 999px;
    border: 1px solid var(--global-base-color);
    color: var(--global-base-color);
    background: rgba(255, 255, 255, 0.6);
    text-decoration: none !important;
    font-size: 0.9em;
    transition: all 0.15s ease-in-out;
  }
  html[data-theme="dark"] .home-hero__btn { background: rgba(42, 47, 35, 0.55); }
  .home-hero__btn:hover {
    background: var(--global-base-color);
    color: #fff;
  }
  .home-explore {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6em;
    justify-content: center;
    margin: 2em 0 0.5em;
  }
  .home-explore a {
    padding: 0.5em 1.2em;
    border-radius: 6px;
    border: 1px solid var(--global-border-color);
    text-decoration: none !important;
    color: var(--global-text-color);
    font-weight: 600;
  }
  .home-explore a:hover {
    border-color: var(--global-base-color);
    color: var(--global-base-color);
  }
</style>

<!-- end custom head snippets -->
